server {
    listen 80;
    listen [::]:80;
    server_name sd.xingke888.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name sd.xingke888.com;

    ssl_certificate /etc/letsencrypt/live/sd.xingke888.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sd.xingke888.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 100M;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Backend API
    location /api/ {
        proxy_pass http://127.0.0.1:8112/;
        proxy_http_version 1.1;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Backend uploads (static files)
    location /uploads/ {
        proxy_pass http://127.0.0.1:8112/uploads/;
        proxy_read_timeout 120s;
    }

    # Next.js frontend (includes HMR websocket)
    location / {
        proxy_pass http://127.0.0.1:8111;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400s;
    }
}
